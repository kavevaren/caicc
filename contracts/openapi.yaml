components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Session token from /api/auth/login or /api/auth/register (stored in localStorage).

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    SuggestionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    QuestionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    AnswerId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthenticated:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Validation:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Per-user rate limit exceeded (AI 20/min, uploads 10/min).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileTooLarge:
      description: File exceeds MAX_UPLOAD_MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AIUnavailable:
      description: ModelScope call failed after retries.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenInvalid:
      description: The configured ModelScope token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: Skeleton only (P1); implemented in later phases.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Lang:
      type: string
      enum: [id, en, zh]
      default: id

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message_key]
          properties:
            code:
              type: string
              description: >
                Known codes: unauthenticated, not_found, validation, rate_limited,
                file_too_long, file_too_large, username_taken, terms_required,
                weak_password, invalid_username, invalid_credentials,
                invalid_time_range, media_too_long, transcription_disabled,
                self_vote, hint_limit_reached, ai_unavailable,
                modelscope_token_invalid, not_implemented.
            message_key:
              type: string
              description: "i18n key, always errors.<code>; the UI appends \"Coba lagi\"."

    Health:
      type: object
      required: [server, modelscope, whisper, version]
      properties:
        server:
          type: string
          const: ok
        modelscope:
          type: string
          enum: [ok, invalid_token, unreachable, checking]
        modelscope_latency_ms:
          type: integer
          minimum: 0
        whisper:
          type: string
          enum: [ready, loading, idle, disabled, error]
        version:
          type: string

    User:
      type: object
      required: [username, display_name, lang, theme, onboarding_done]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{3,20}$"
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        lang:
          $ref: "#/components/schemas/Lang"
        theme:
          type: string
          enum: [system, light, dark]
        reduce_motion:
          type: boolean
          default: false
        onboarding_done:
          type: boolean

    RegisterRequest:
      type: object
      required: [username, display_name, password, lang, accept_terms]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{3,20}$"
          description: 3-20 characters [A-Za-z0-9_], unique.
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 200
        lang:
          $ref: "#/components/schemas/Lang"
        accept_terms:
          type: boolean
          default: false
          description: "Must be true; otherwise the server returns terms_required."

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    Me:
      type: object
      required: [user, points, rank, unread, onboarding_done]
      properties:
        user:
          $ref: "#/components/schemas/User"
        points:
          type: integer
          minimum: 0
        rank:
          type: integer
          minimum: 1
        unread:
          type: integer
          minimum: 0
        onboarding_done:
          type: boolean

    PatchMeRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        lang:
          $ref: "#/components/schemas/Lang"
        theme:
          type: string
          enum: [system, light, dark]
        reduce_motion:
          type: boolean
        notif_prefs:
          type: object
          additionalProperties:
            type: boolean

    Subject:
      type: object
      required: [id, name, followed]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        followed:
          type: boolean

    Dashboard:
      type: object
      required: [week, next_event, stats, points_ring, questions_for_you, reminders, top5, me_row, recent]
      properties:
        week:
          type: array
          minItems: 7
          maxItems: 7
          description: Monday to Sunday, ISO dates.
          items:
            type: object
            required: [date, events]
            properties:
              date:
                type: string
                format: date
              events:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        next_event:
          oneOf:
            - $ref: "#/components/schemas/Event"
            - type: "null"
        stats:
          type: object
          required: [summaries, transcripts, my_unanswered, points, rank]
          properties:
            summaries:
              type: integer
              minimum: 0
            transcripts:
              type: integer
              minimum: 0
            my_unanswered:
              type: integer
              minimum: 0
            points:
              type: integer
              minimum: 0
            rank:
              type: integer
              minimum: 1
        points_ring:
          type: object
          required: [current, target, rank]
          properties:
            current:
              type: integer
              minimum: 0
              description: Points this week (Asia/Jakarta, from Monday 00:00).
            target:
              type: integer
              minimum: 0
              description: Points needed for the next rank.
            rank:
              type: integer
              minimum: 1
        questions_for_you:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        reminders:
          type: array
          items:
            type: object
            required: [kind, text_key, created_at]
            properties:
              kind:
                type: string
                enum: [event_soon, new_question, new_answer, best_answer, rank_change]
              text_key:
                type: string
              text_params:
                type: object
                additionalProperties: true
              created_at:
                type: string
                format: date-time
        top5:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/LeaderboardRow"
        me_row:
          $ref: "#/components/schemas/LeaderboardRow"
        recent:
          type: array
          maxItems: 6
          items:
            type: object
            required: [kind, title, created_at]
            properties:
              kind:
                type: string
                enum: [summary, transcript]
              title:
                type: string
              subject:
                type: string
              created_at:
                type: string
                format: date-time

    Job:
      type: object
      required: [id, kind, status, stage, stages, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [summary, transcript]
        status:
          type: string
          enum: [queued, running, done, error]
        stage:
          type: string
          description: >
            summary: extract | figures | chunk | map | reduce | format_check | deadlines;
            transcript: probe | transcribe | parse | translate | summarize.
        stages:
          type: array
          items:
            type: string
        result_document_id:
          type: [integer, "null"]
        error_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobRef:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid

    Document:
      type: object
      required: [id, kind, title, content_md, created_at]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [summary, transcript]
        title:
          type: string
        subject_id:
          type: [integer, "null"]
        subject:
          type: [string, "null"]
        source_files:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              size_bytes:
                type: integer
                minimum: 0
        content_md:
          type: string
        extra:
          type: object
          description: >
            summary: "{figures: [Figure], sources: [{label, text}], ai_calls: [...]}"
            transcript: {segments: [{start, end, text}], translations: {lang: [...]},
            meeting: {summary_md, decisions, action_items}, ai_calls: [...]}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time

    DocumentList:
      type: object
      required: [items, total, page, pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 0

    Figure:
      type: object
      required: [ref_no, kind, caption, relevance, included]
      properties:
        ref_no:
          type: integer
        kind:
          type: string
          enum: [extracted, chart]
        source_label:
          type: string
        category:
          type: string
        caption:
          type: string
        relevance:
          type: number
          minimum: 0
          maximum: 1
        included:
          type: boolean
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        chart_spec:
          type: ["object", "null"]
          description: Present for kind=chart (SPEC §10.6 ChartSpec).

    Event:
      type: object
      required: [id, title, start_at, end_at, source, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 150
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: "Must be strictly after start_at (invalid_time_range otherwise)."
        location:
          type: [string, "null"]
        description:
          type: [string, "null"]
        reminder_minutes:
          type: [integer, "null"]
          enum: [10, 60, 1440, null]
        source:
          type: string
          enum: [manual, ai, google]
        google_event_id:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    CreateEventRequest:
      type: object
      required: [title, start_at, end_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: "Must be strictly after start_at (invalid_time_range otherwise)."
        location:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 2000
        reminder_minutes:
          type: integer
          enum: [10, 60, 1440]

    Suggestion:
      type: object
      required: [id, title, start_at, evidence, status]
      properties:
        id:
          type: integer
        document_id:
          type: [integer, "null"]
        title:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: [string, "null"]
          format: date-time
        evidence:
          type: string
        status:
          type: string
          enum: [pending, added, dismissed]

    Question:
      type: object
      required: [id, title, subject, author, status, answers_count, score, created_at]
      properties:
        id:
          type: integer
        title:
          type: string
          minLength: 10
          maxLength: 150
          description: "10-150 characters, enforced client and server."
        body_md:
          type: [string, "null"]
        subject:
          type: string
        subject_id:
          type: [integer, "null"]
        tags:
          type: array
          maxItems: 5
          items:
            type: string
        author:
          $ref: "#/components/schemas/Author"
        status:
          type: string
          enum: [open, answered]
        best_answer_id:
          type: [integer, "null"]
        answers_count:
          type: integer
          minimum: 0
        score:
          type: integer
        excerpt:
          type: [string, "null"]
          description: 160-character excerpt for list rows.
        has_attachment:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time

    QuestionDetail:
      allOf:
        - $ref: "#/components/schemas/Question"
        - type: object
          required: [answers]
          properties:
            answers:
              type: array
              items:
                $ref: "#/components/schemas/Answer"
            following:
              type: boolean
            votes_mine:
              type: integer
              enum: [-1, 0, 1]
            hints_remaining:
              type: integer
              minimum: 0
              maximum: 3

    QuestionList:
      type: object
      required: [items, total, page, pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 0

    Author:
      type: object
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string

    Answer:
      type: object
      required: [id, body_md, author, score, is_best, created_at]
      properties:
        id:
          type: integer
        body_md:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        score:
          type: integer
        is_best:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    Attachment:
      type: object
      required: [id, filename, mime, size_bytes]
      properties:
        id:
          type: integer
        filename:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
          minimum: 0

    LeaderboardRow:
      type: object
      required: [rank, display_name, points, is_me]
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        points:
          type: integer
          minimum: 0
        answers:
          type: integer
          minimum: 0
        best_answers:
          type: integer
          minimum: 0
        is_me:
          type: boolean

    Leaderboard:
      type: object
      required: [items, me, window]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
        me:
          oneOf:
            - $ref: "#/components/schemas/LeaderboardRow"
            - type: "null"
        window:
          type: string
          enum: [week, month, all]
        subject:
          type: [string, "null"]

    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Notification"
        unread:
          type: integer
          minimum: 0

    Notification:
      type: object
      required: [id, kind, text_key, is_read, created_at]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [event_soon, new_question, new_answer, best_answer, rank_change]
        text_key:
          type: string
        text_params:
          type: object
          additionalProperties: true
        link:
          type: [string, "null"]
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
