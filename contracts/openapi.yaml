                title:
                  type: string
                  minLength: 10
                  maxLength: 150
                body_md:
                  type: string
                  maxLength: 10000
                subject_id:
                  type: integer
                tags:
                  type: string
                  description: Comma-separated, <= 5.
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The published question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          description: moderation rejected the post (spam/abusive/off_topic) or title length violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
