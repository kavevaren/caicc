          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Forum (F4)]
      operationId: createQuestion
      summary: Ask a question (title 10-150 chars; moderation runs before publish; +2 points)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, body_md, subject_id]
