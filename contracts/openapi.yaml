openapi: 3.1.0
info:
  title: Orvina API
  version: 0.1.0
  description: |
    Public API between the React SPA (web/) and the FastAPI server (server/).
    This file is the source of truth: change the contract first, then both sides (SPEC §3.1).

    Conventions (SPEC §6):
    - JSON, except uploads (multipart) and downloads.
    - Errors: {"error": {"code": "...", "message_key": "errors.<code>"}} with a proper status.
      No stack trace ever reaches the browser; details go to the log.
    - Auth: Bearer token in Authorization. The token lives in localStorage (the Studio
      embeds the app in a cross-site iframe where cookies are unreliable).
    - SSE uses the stream-ticket flow: POST /api/stream-ticket {job_id} -> single-use
      ticket valid 60 s -> GET /api/jobs/{id}/stream?ticket=...
    - Lists paginate with page (20 per page) and return {items, total, page, pages}.
    - Rate limits per user (in memory): AI endpoints 20/min, uploads 10/min -> 429 rate_limited.
    - ai_unavailable -> 502, modelscope_token_invalid -> 503 (from the cached health check).

    SSE event shapes for GET /api/jobs/{id}/stream:
      event: stage   data: {"job_id": "...", "stage": "extract", "stages": ["extract", "figures", ...]}
      event: done    data: {"job_id": "...", "result_document_id": 42}
      event: error   data: {"job_id": "...", "error_code": "media_too_long"}
      A comment line (": heartbeat") is sent every 15 s to keep the connection alive.
      If no event arrives within 10 s, the client falls back to polling GET /api/jobs/{id} every 2 s (SPEC §13).

    Bug-driven schema constraints:
    - question title: 10-150 characters (client and server).
    - event end_at must be strictly after start_at (server rejects with invalid_time_range).
    - register accept_terms must be true (server rejects with terms_required).

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Subjects
  - name: Dashboard
  - name: Jobs
  - name: Summaries (F1)
  - name: Transcripts (F2)
  - name: Schedule (F3)
  - name: Forum (F4)
  - name: Points
  - name: Notifications
  - name: Files

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Server, ModelScope and whisper status (ModelScope result cached 5 min)
      security: []
      responses:
        "200":
          description: Status of the server, the ModelScope probe and whisper.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; the token is stored in localStorage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: accept_terms not true (terms_required), weak password (weak_password) or invalid username format (invalid_username).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: username taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in (a failure never reveals whether the username exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: invalid_credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate the session
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/stream-ticket:
    post:
      tags: [Auth]
      operationId: createStreamTicket
      summary: Single-use 60 s ticket for the job SSE stream (Bearer cannot be sent by EventSource)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Ticket valid for 60 s and a single GET /api/jobs/{id}/stream.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in]
                properties:
                  ticket:
                    type: string
                  expires_in:
                    type: integer
                    const: 60
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current user, points, rank, unread count, onboarding state
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      tags: [Me]
      operationId: patchMe
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Validation"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/me/password:
    post:
      tags: [Me]
      operationId: changePassword
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password changed.
        "400":
          description: wrong current password or weak new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/me/onboarding:
    post:
      tags: [Me]
      operationId: completeOnboarding
      summary: 3-step onboarding (language -> subjects -> Google, skippable); once per user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang, subject_ids, new_subjects, done]
              properties:
                lang:
                  $ref: "#/components/schemas/Lang"
                subject_ids:
                  type: array
                  items:
                    type: integer
                new_subjects:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                done:
                  type: boolean
      responses:
        "200":
          description: Onboarding state saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/subjects:
    get:
      tags: [Subjects]
      operationId: listSubjects
      summary: All subjects plus the current user's followed flag
      responses:
        "200":
          description: Subject list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subject"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Subjects]
      operationId: createSubject
      summary: Create (or reuse) a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
      responses:
        "201":
          description: The subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: "One call, real data: week atom, stats, quick lists (SPEC §6, §8.2)"
      responses:
        "200":
          description: Dashboard payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Job state — also the polling fallback for the SSE stream
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/jobs/{id}/stream:
    get:
      tags: [Jobs]
      operationId: streamJob
      summary: SSE stream of job progress (events stage/done/error, 15 s heartbeat)
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: ticket
          in: query
          required: true
          schema:
            type: string
          description: Single-use ticket from POST /api/stream-ticket (60 s).
      responses:
        "200":
          description: Server-Sent Events stream. See info.description for the event shapes.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: ticket missing, used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/summaries:
    post:
      tags: [Summaries (F1)]
      operationId: createSummary
      summary: "Start an F1 summary job (multipart: files + options)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: pdf, pptx, docx, txt, md, png, jpg, jpeg, mp4, mov, webm, mp3, wav, m4a; each <= MAX_UPLOAD_MB.
                title:
                  type: string
                  maxLength: 150
                  description: Defaults to the first filename.
                subject_id:
                  type: integer
                style:
                  type: string
                  enum: [one_page, structured_notes, key_points, qa_practice]
                  default: structured_notes
                lang:
                  $ref: "#/components/schemas/Lang"
                detail:
                  type: string
                  enum: [singkat, standar, detail]
                  default: standar
                extra:
                  type: string
                  maxLength: 500
                include_figures:
                  type: boolean
                  default: true
                generate_charts:
                  type: boolean
                  default: true
      responses:
        "202":
          description: Job queued; poll or stream /api/jobs/{id}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRef"
        "400":
          description: media_too_long (checked in the job's probe stage) or unsupported file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/AIUnavailable"
        "503":
          $ref: "#/components/responses/TokenInvalid"

  /api/documents:
    get:
      tags: [Summaries (F1)]
      operationId: listDocuments
      summary: "Library: search, filter by kind and subject"
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [summary, transcript]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: subject
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Paginated documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/documents/{id}:
    get:
      tags: [Summaries (F1)]
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document with content, figures and extra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      tags: [Summaries (F1)]
      operationId: patchDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 150
                subject_id:
                  type: integer
                content_md:
                  type: string
      responses:
        "200":
          description: Updated document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Summaries (F1)]
      operationId: deleteDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/documents/{id}/figures/{ref}:
    patch:
      tags: [Summaries (F1)]
      operationId: patchFigure
      summary: Toggle a figure in/out of the rendered summary (no model call)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: ref
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [included]
              properties:
                included:
                  type: boolean
      responses:
        "200":
          description: Updated figure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Figure"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/documents/{id}/export:
    get:
      tags: [Summaries (F1)]
      operationId: exportDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [md, html]
      responses:
        "200":
          description: .md as a zip (summary.md + images/), or a standalone .html.
          content:
            application/zip:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/figures/{id}.png:
    get:
      tags: [Summaries (F1)]
      operationId: getFigurePng
      summary: Figure image (visibility checked)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The PNG image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/transcripts:
    post:
      tags: [Transcripts (F2)]
      operationId: createTranscript
      summary: "Start an F2 job (multipart: media, recorded blob, or transcript file .srt/.vtt/.txt + options)"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 150
                source_lang:
                  type: string
                  enum: [auto, id, en, zh]
                  default: auto
                targets:
                  type: array
                  items:
                    $ref: "#/components/schemas/Lang"
                summary:
                  type: boolean
                  default: true
      responses:
        "202":
          description: Job queued; poll or stream /api/jobs/{id}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRef"
        "400":
          description: transcription_disabled (ENABLE_TRANSCRIPTION=false, media input) or media_too_long.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/AIUnavailable"
        "503":
          $ref: "#/components/responses/TokenInvalid"

  /api/events:
    get:
      tags: [Schedule (F3)]
      operationId: listEvents
      summary: "Events in a date range (default: today to +30 days)"
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Events ordered by start_at.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Schedule (F3)]
      operationId: createEvent
      summary: New event; end_at must be strictly after start_at
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: invalid_time_range (end_at not after start_at).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Validation"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/events/{id}:
    patch:
      tags: [Schedule (F3)]
      operationId: patchEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 150
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                location:
                  type: string
                  maxLength: 150
                description:
                  type: string
                  maxLength: 2000
                reminder_minutes:
                  type: integer
                  enum: [10, 60, 1440]
      responses:
        "200":
          description: Updated event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: invalid_time_range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Schedule (F3)]
      operationId: deleteEvent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/events/{id}.ics:
    get:
      tags: [Schedule (F3)]
      operationId: downloadEventIcs
      summary: RFC 5545 .ics for one event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: The .ics file.
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/suggestions:
    get:
      tags: [Schedule (F3)]
      operationId: listSuggestions
      summary: Pending deadline suggestions (from summaries)
      responses:
        "200":
          description: Suggestions with status pending.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suggestion"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/suggestions/{id}/accept:
    post:
      tags: [Schedule (F3)]
      operationId: acceptSuggestion
      summary: Create the event from the suggestion
      parameters:
        - $ref: "#/components/parameters/SuggestionId"
      responses:
        "201":
          description: The created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/suggestions/{id}/dismiss:
    post:
      tags: [Schedule (F3)]
      operationId: dismissSuggestion
      parameters:
        - $ref: "#/components/parameters/SuggestionId"
      responses:
        "204":
          description: Dismissed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
